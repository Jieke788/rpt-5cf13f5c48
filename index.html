<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow">

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>日报分析看板 · 南区</title>
<style>
  :root{
    --bg:#f5f5f7;
    --card:#ffffff;
    --ink:#1d1d1f;
    --ink-2:#6e6e73;
    --ink-3:#a1a1a6;
    --line:#e9e9ee;
    --blue:#0071e3;
    --green:#34c759;
    --amber:#ff9f0a;
    --red:#ff453a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB",sans-serif;
    --num:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    letter-spacing:-.005em;font-feature-settings:"tnum";
  }
  button{font-family:inherit;color:inherit}

  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(245,245,247,.78);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06);
  }
  .topbar-inner{
    max-width:1180px;margin:0 auto;padding:13px 28px;
    display:flex;align-items:center;gap:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .mark{
    width:28px;height:28px;border-radius:9px;background:var(--ink);color:#fff;
    display:grid;place-items:center;flex:0 0 auto;
  }
  .brand b{font-size:13.5px;font-weight:590;letter-spacing:-.012em;white-space:nowrap}
  .brand span{font-size:10px;color:var(--ink-3);letter-spacing:.08em;margin-left:2px}
  .seg{
    margin-left:auto;display:flex;padding:3px;border-radius:12px;background:#e9e9ee;
    flex:0 0 auto;
  }
  .seg button{
    border:0;background:transparent;padding:6px 17px;border-radius:9.5px;
    font-size:12.5px;color:var(--ink-2);cursor:pointer;transition:.2s;white-space:nowrap;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.on{
    background:#fff;color:var(--ink);font-weight:590;
    box-shadow:0 1px 2px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.06);
  }

  .hero{
    position:relative;max-width:1180px;margin:0 auto;padding:58px 28px 26px;
    overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;right:-160px;top:-120px;width:520px;height:520px;
    background:radial-gradient(circle,rgba(0,113,227,.14),rgba(0,113,227,0) 68%);
    pointer-events:none;
  }
  .eyebrow{
    font-family:var(--num);font-size:10.5px;letter-spacing:.2em;color:var(--ink-3);
    margin-bottom:12px;text-transform:uppercase;
  }
  h1{margin:0;font-size:42px;font-weight:600;letter-spacing:-.038em;line-height:1.08;max-width:820px}
  .sub{margin:14px 0 0;color:#86868b;font-size:13.5px}
  .hero-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .chip{
    font-family:var(--num);font-size:10.5px;color:var(--ink-2);
    background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.06);
    padding:5px 10px;border-radius:99px;white-space:nowrap;
  }
  .chip b{color:var(--ink);font-weight:590}

  .grid{max-width:1180px;margin:0 auto;padding:0 28px 80px;display:flex;flex-direction:column;gap:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .kpi{
    position:relative;background:var(--card);border-radius:24px;padding:22px 22px 20px;
    border:1px solid rgba(0,0,0,.04);
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 14px 34px -24px rgba(0,0,0,.28);
    transition:transform .2s ease,box-shadow .2s ease;
  }
  .kpi:hover{transform:translateY(-2px);box-shadow:0 1px 2px rgba(0,0,0,.03),0 22px 44px -24px rgba(0,0,0,.3)}
  .kpi .lb{font-size:12.5px;color:#86868b;display:flex;align-items:center;gap:6px}
  .kpi .lb i{width:7px;height:7px;border-radius:50%;display:inline-block}
  .kpi .v{font-family:var(--num);font-size:40px;font-weight:600;letter-spacing:-.04em;margin-top:10px;line-height:1.02}
  .kpi .v small{font-size:14px;font-weight:400;color:var(--ink-3);margin-left:4px;letter-spacing:0}
  .kpi .nt{margin-top:8px;font-size:11.5px;color:#86868b;min-height:17px}
  .meter{margin-top:14px;height:5px;border-radius:99px;background:#f0f0f3;overflow:hidden}
  .meter i{display:block;height:100%;border-radius:99px;transition:width .5s ease}

  .card{
    background:var(--card);border-radius:24px;overflow:hidden;
    border:1px solid rgba(0,0,0,.04);
    box-shadow:0 1px 2px rgba(0,0,0,.03),0 14px 34px -24px rgba(0,0,0,.28);
  }
  .ph{display:flex;align-items:baseline;gap:12px;padding:20px 24px 14px;flex-wrap:wrap}
  .ph h2{margin:0;font-size:16.5px;font-weight:590;letter-spacing:-.016em}
  .ph span{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
  .member-filter{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
  .member-filter select{
    appearance:none;-webkit-appearance:none;
    border:1px solid rgba(0,0,0,.06);background-color:#f5f5f7;color:var(--ink);
    border-radius:9px;padding:6px 28px 6px 10px;
    font-size:12px;font-family:var(--font);cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%2386868b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 9px center;
  }
  .member-filter select:hover{background-color:#ececf0}
  .member-filter select:focus{outline:2px solid rgba(0,113,227,.35);outline-offset:2px}
  .body{padding:0 24px 22px}

  .mx-head,.mx-row{
    display:grid;grid-template-columns:132px repeat(var(--n),minmax(0,1fr));
    gap:8px;align-items:center;
  }
  .mx-head{margin-bottom:9px}
  .mx-head span{font-size:10.5px;color:var(--ink-3);text-align:center;letter-spacing:.02em}
  .mx-head span:first-child{text-align:left}
  .mx-head em{display:block;font-style:normal;font-size:9px;color:#c1c1c6;margin-top:1px}
  .mx-row + .mx-row{margin-top:8px}
  .mx-name{display:flex;align-items:center;gap:9px;min-width:0}
  .mx-name b{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ava{
    width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    font-size:10.5px;font-weight:590;flex:0 0 auto;
  }
  .cell{
    height:48px;border-radius:12px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;
    border:1px solid transparent;background:#f5f5f7;
    transition:transform .16s ease,box-shadow .16s ease;
  }
  .cell .ic{font-size:11.5px;font-weight:600;font-family:var(--num);line-height:1.2}
  .cell .pcnt{font-size:9.5px;color:var(--ink-3);font-family:var(--num)}
  .cell.ok{background:#edfaf1;border-color:#d7f2e0;color:#1f9a44}
  .cell.ok .pcnt{color:#5fa97a}
  .cell.late{background:#fff8ec;border-color:#ffe6bf;color:#b26a00}
  .cell.late .pcnt{color:#c08a45}
  .cell.miss{background:#fff;border:1px dashed #d9d9de;color:#aeaeb2}
  .cell:hover{transform:translateY(-1px);box-shadow:0 4px 10px -6px rgba(0,0,0,.25)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:10.5px;color:var(--ink-3)}
  .legend span{display:flex;align-items:center}
  .legend i{width:9px;height:9px;border-radius:4px;display:inline-block;margin-right:6px}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th{
    font-size:10.5px;font-weight:400;color:var(--ink-3);text-align:right;
    padding:0 14px 9px;white-space:nowrap;letter-spacing:.02em;
  }
  th:first-child{text-align:left;padding-left:0}
  td{padding:10px 14px;border-top:1px solid #f0f0f2;text-align:right;font-family:var(--num);font-size:12.5px;white-space:nowrap}
  td:first-child{text-align:left;padding-left:0;font-family:var(--font)}
  tbody tr{transition:background .16s}
  tbody tr:hover{background:#fafafc}
  .nm{display:flex;align-items:center;gap:9px}
  .nm b{font-size:12.5px;font-weight:500}
  .bad{color:#c93400;font-weight:600}
  .zero{color:#c7c7cc}
  tfoot td{border-top:1px solid var(--line);padding-top:12px;padding-bottom:2px;font-weight:600}
  tfoot td:first-child{font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .empty{padding:26px 0 30px;text-align:center;font-size:12.5px;color:var(--ink-3)}

  .plan-block + .plan-block{margin-top:26px;padding-top:24px;border-top:1px solid #f0f0f2}
  .plan-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .plan-head .ava{width:30px;height:30px;font-size:11.5px}
  .plan-head b{font-size:14px;font-weight:590}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip2{
    font-family:var(--num);font-size:9.5px;color:var(--ink-2);
    background:#f5f5f7;border-radius:99px;padding:3px 8px;white-space:nowrap;
  }
  .chip2 b{font-weight:600;color:var(--ink)}
  .plan-table td{vertical-align:top;white-space:normal;line-height:1.55}
  .plan-table td:first-child,.plan-table td:nth-child(2){white-space:nowrap}
  .plan-table .plan-text{min-width:260px;color:#6e6e73;font-family:var(--font);font-size:12px}
  .status{
    display:inline-flex;align-items:center;gap:4px;border-radius:99px;
    padding:2px 8px;font-family:var(--font);font-size:10.5px;white-space:nowrap;
  }
  .status.ok{background:#edfaf1;color:#1f9a44}
  .status.late{background:#fff8ec;color:#b26a00}
  .status.miss{background:#f5f5f7;color:#a1a1a6}
  .cust{font-family:var(--font);font-size:12px;color:var(--ink-2);white-space:normal}

  details.day-detail{
    background:#fafafc;border:1px solid #f0f0f2;border-radius:14px;
    margin:8px 0;overflow:hidden;
  }
  details.day-detail summary{
    cursor:pointer;list-style:none;padding:10px 14px;font-size:11.5px;font-weight:590;
    display:flex;align-items:center;gap:8px;
  }
  details.day-detail summary::-webkit-details-marker{display:none}
  details.day-detail summary::after{content:"展开";margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:400}
  details.day-detail[open] summary::after{content:"收起"}
  .dd-body{padding:0 14px 14px}
  .dd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px}
  .dd-grid div{display:flex;gap:10px;font-size:11.5px;line-height:1.55}
  .dd-grid span{color:var(--ink-3);flex:0 0 76px}
  .dd-grid b{font-weight:500;color:var(--ink-2);word-break:break-word}
  .dd-grid .wide{grid-column:1/-1}

  footer{padding:6px 2px 0;text-align:center;font-size:10.5px;color:var(--ink-3);line-height:1.7}

  @media (max-width:900px){
    .topbar-inner{padding:12px 18px}
    .hero{padding:38px 18px 20px}
    h1{font-size:30px}
    .grid{padding:0 18px 60px}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .mx-head,.mx-row{grid-template-columns:96px repeat(var(--n),minmax(0,1fr));gap:6px}
    .cell{height:44px}
    .ph,.body{padding-left:18px;padding-right:18px}
    .dd-grid{grid-template-columns:1fr}
    .dd-grid span{flex-basis:86px}
  }
  @media (max-width:560px){
    .brand span{display:none}
    h1{font-size:26px}
    .kpi .v{font-size:32px}
    th,td{padding-left:9px;padding-right:9px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="mark">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 19V11M10 19V5M15 19v-5M20 19V8"/></svg>
      </span>
      <b>日报分析看板</b>
      <span>DAILY ANALYSIS</span>
    </div>
    <div class="seg" id="periodSeg">
      <button data-period="week" class="on">周报</button>
      <button data-period="month">月报</button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="eyebrow">Daily Report · 日报分析</div>
    <h1>日报分析看板</h1>
    <p class="sub" id="sub"></p>
    <div class="hero-meta" id="heroMeta"></div>
  </section>

  <section class="grid">
    <div class="kpis" id="kpis"></div>

    <section class="card" id="matrixSection">
      <div class="ph"><h2>提交矩阵</h2><span id="mxHint"></span></div>
      <div class="body" id="matrix"></div>
    </section>

    <section class="card">
      <div class="ph"><h2>成员提交</h2><span>应交 = 统计期内工作日（周一至周五）</span></div>
      <div class="body table-wrap" id="memberTable"></div>
    </section>

    <section class="card">
      <div class="ph"><h2>客户拜访</h2><span id="visitHint"></span></div>
      <div class="body table-wrap" id="visits"></div>
    </section>

    <section class="card">
      <div class="ph">
        <h2>成员每日计划</h2>
        <label class="member-filter">成员
          <select id="memberSelect" aria-label="选择成员"></select>
        </label>
        <span>日报正文 / 真实模板字段</span>
      </div>
      <div class="body" id="plans"></div>
    </section>

    <footer>
      口径：仅统计周一至周五 · 当月 1 号至基准日 · 只统计当月发过日报的人 · 23:00 前为按时 · 图片按张数、按天去重<br />
      <span>南区 · 11月16日 — 11月22日 · 1 个工作日 · 日报分析看板</span>
    </footer>
  </section>

<script>
  const DATASETS = {
    week: JSON.parse(document.getElementById('data-week').textContent),
    month: JSON.parse(document.getElementById('data-month').textContent)
  };

  const STATUS = {
    on_time: { text: '按时', cls: 'ok', icon: '✓' },
    late: { text: '迟交', cls: 'late', icon: '!' },
    missing: { text: '未提交', cls: 'miss', icon: '—' }
  };
  const COLORS = ['#0071e3', '#5e5ce6', '#ff9f0a', '#34c759', '#ff375f'];
  let current = 'week';
  let selectedMember = 'all';

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function mmdd(date) {
    const [, m, d] = date.split('-').map(Number);
    return `${m}/${d}`;
  }
  function weekday(date) {
    return ['周日','周一','周二','周三','周四','周五','周六'][new Date(`${date}T00:00:00Z`).getUTCDay()];
  }
  function mondayOf(date) {
    const index = new Date(`${date}T00:00:00Z`).getUTCDay();
    const offset = (index + 6) % 7;
    const dt = new Date(`${date}T00:00:00Z`);
    dt.setUTCDate(dt.getUTCDate() - offset);
    return dt.toISOString().slice(0, 10);
  }
  function initials(name) {
    return String(name ?? '').slice(-1);
  }
  function show(value) {
    return value == null || value === '' ? '—' : esc(value);
  }
  function statsOf(submissions) {
    const s = { expected: submissions.length, submitted: 0, onTime: 0, late: 0, missing: 0, withPhoto: 0 };
    for (const item of submissions) {
      if (item.status === 'missing') { s.missing++; continue; }
      s.submitted++;
      if (item.status === 'late') s.late++; else s.onTime++;
      if (item.photos > 0) s.withPhoto++;
    }
    s.onTimeRate = s.expected ? s.onTime / s.expected : 0;
    s.photoRate = s.submitted ? s.withPhoto / s.submitted : 0;
    return s;
  }
  function byMember(dashboard) {
    const map = new Map(dashboard.members.map((m) => [m.id, []]));
    for (const submission of dashboard.submissions) {
      if (!map.has(submission.memberId)) map.set(submission.memberId, []);
      map.get(submission.memberId).push(submission);
    }
    return map;
  }
  function groupWeeks(workdays) {
    const map = new Map();
    for (const day of workdays) {
      const monday = mondayOf(day);
      const list = map.get(monday) ?? [];
      list.push(day);
      map.set(monday, list);
    }
    return [...map.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([, days], index) => ({
        label: `第${index + 1}周`,
        sub: `${mmdd(days[0])}–${mmdd(days[days.length - 1])}`,
        days: days.sort()
      }));
  }

  function renderKpis(dashboard) {
    const stats = statsOf(dashboard.submissions);
    const cards = [
      { lb: '按时率', dot: 'var(--green)', value: `${Math.round(stats.onTimeRate * 100)}`, unit: '%', note: `按时 ${stats.onTime} / 应提交 ${stats.expected}`, bar: stats.onTimeRate, color: 'var(--green)' },
      { lb: '已提交', dot: 'var(--blue)', value: stats.submitted, unit: `/ ${stats.expected}`, note: `迟交 ${stats.late} 次 · 覆盖率 ${stats.expected ? Math.round(stats.submitted / stats.expected * 100) : 0}%`, bar: stats.expected ? stats.submitted / stats.expected : 0, color: 'var(--blue)' },
      { lb: '带照片', dot: 'var(--amber)', value: stats.withPhoto, unit: '天', note: `占提交 ${Math.round(stats.photoRate * 100)}% · 图片按天计`, bar: stats.photoRate, color: 'var(--amber)' },
      { lb: '未提交', dot: '#d2d2d7', value: stats.missing, unit: '次', note: stats.missing ? '有成员未提交' : '全部按时覆盖', bar: stats.expected ? stats.missing / stats.expected : 0, color: 'var(--red)' }
    ];
    document.getElementById('kpis').innerHTML = cards.map((c) => `
      <div class="kpi">
        <div class="lb"><i style="background:${c.dot}"></i>${c.lb}</div>
        <div class="v">${c.value}<small>${c.unit}</small></div>
        <div class="nt">${c.note}</div>
        <div class="meter"><i style="width:${Math.min(100, c.bar * 100).toFixed(1)}%;background:${c.color}"></i></div>
      </div>`).join('');
  }

  function renderMatrix(dashboard) {
    const members = dashboard.members ?? [];
    const submissions = dashboard.submissions ?? [];
    const map = new Map(submissions.map((s) => [`${s.memberId}|${s.date}`, s]));
    let head = '';
    let cellsFor = null;

    if (dashboard.period === 'week') {
      const workdays = dashboard.workdays ?? [];
      head = `<div class="mx-head" style="--n:${workdays.length}"><span>成员</span>${workdays.map((d) => `<span>${weekday(d)} ${mmdd(d)}</span>`).join('')}</div>`;
      cellsFor = (member) => workdays.map((day) => {
        const item = map.get(`${member.id}|${day}`);
        if (!item || item.status === 'missing') {
          return `<div class="cell miss" title="${esc(member.name)} · ${day} · 未提交"><div class="ic">—</div><div class="pcnt">缺失</div></div>`;
        }
        const st = STATUS[item.status];
        return `<div class="cell ${st.cls}" title="${esc(member.name)} · ${day} · ${st.text} · ${item.at ?? ''} · ${item.photos} 张图"><div class="ic">${st.icon}</div><div class="pcnt">${item.photos} 图</div></div>`;
      }).join('');
    } else {
      const weeks = groupWeeks(dashboard.workdays ?? []);
      head = `<div class="mx-head" style="--n:${weeks.length}"><span>成员</span>${weeks.map((week) => `<span>${week.label}<em>${week.sub}</em></span>`).join('')}</div>`;
      cellsFor = (member) => weeks.map((week) => {
        const items = submissions.filter((item) => item.memberId === member.id && week.days.includes(item.date));
        if (!items.length) {
          return `<div class="cell miss"><div class="ic">—</div><div class="pcnt">无记录</div></div>`;
        }
        const stats = statsOf(items);
        const cls = stats.missing ? 'miss' : stats.late ? 'late' : 'ok';
        const icon = stats.missing ? '—' : stats.late ? '!' : '✓';
        return `<div class="cell ${cls}" title="${esc(member.name)} · ${week.label} · 提交 ${stats.submitted}/${stats.expected}"><div class="ic">${icon}</div><div class="pcnt">${stats.submitted}/${stats.expected}</div></div>`;
      }).join('');
    }

    const rows = members.map((member, index) => {
      const color = COLORS[index % COLORS.length];
      return `<div class="mx-row" style="--n:${dashboard.period === 'week' ? (dashboard.workdays ?? []).length : groupWeeks(dashboard.workdays ?? []).length}">
        <div class="mx-name"><span class="ava" style="background:${color}14;color:${color}">${esc(initials(member.name))}</span><b>${esc(member.name)}</b></div>
        ${cellsFor(member)}
      </div>`;
    }).join('');

    const legend = `<div class="legend">
      <span><i style="background:#edfaf1;border:1px solid #d7f2e0"></i>按时</span>
      <span><i style="background:#fff8ec;border:1px solid #ffe6bf"></i>迟交</span>
      <span><i style="background:#fff;border:1px dashed #d9d9de"></i>未提交</span>
    </div>`;
    document.getElementById('matrix').innerHTML = head + rows + legend;
    document.getElementById('mxHint').textContent = dashboard.period === 'week'
      ? `${(dashboard.workdays ?? []).length} 个工作日 × ${members.length} 人`
      : `${groupWeeks(dashboard.workdays ?? []).length} 个自然周 × ${members.length} 人`;
  }

  function renderMembers(dashboard) {
    const submissionsByMember = byMember(dashboard);
    const visits = dashboard.visits ?? [];
    const rows = dashboard.members.map((member, index) => {
      const color = COLORS[index % COLORS.length];
      const stats = statsOf(submissionsByMember.get(member.id) ?? []);
      const memberVisits = visits.filter((visit) => visit.memberId === member.id);
      const customerCount = new Set(memberVisits.map((visit) => visit.customer)).size;
      return `<tr>
        <td><div class="nm"><span class="ava" style="background:${color}14;color:${color}">${esc(initials(member.name))}</span><b>${esc(member.name)}</b></div></td>
        <td>${stats.expected}</td>
        <td>${stats.submitted}</td>
        <td class="${stats.missing ? 'bad' : 'zero'}">${stats.missing || '—'}</td>
        <td>${stats.withPhoto}</td>
        <td><b>${memberVisits.length}</b></td>
        <td>${stats.expected ? Math.round(stats.onTimeRate * 100) : 0}%</td>
      </tr>`;
    }).join('');
    const all = statsOf(dashboard.submissions);
    const allVisits = visits.length;
    document.getElementById('memberTable').innerHTML = `
      <table>
        <thead><tr><th>同事</th><th>应交</th><th>实交</th><th>未交</th><th>带照片</th><th>拜访次数</th><th>按时率</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td>合计 · ${dashboard.members.length} 人</td><td>${all.expected}</td><td>${all.submitted}</td><td class="${all.missing ? 'bad' : 'zero'}">${all.missing || '—'}</td><td>${all.withPhoto}</td><td>${allVisits}</td><td>${Math.round(all.onTimeRate * 100)}%</td></tr></tfoot>
      </table>`;
  }

  function renderVisits(dashboard) {
    const visits = dashboard.visits ?? [];
    document.getElementById('visitHint').textContent = `${visits.length} 次拜访 · ${new Set(visits.map((v) => v.customer)).size} 家客户`;
    if (!visits.length) {
      document.getElementById('visits').innerHTML = '<div class="empty">本期没有拜访记录</div>';
      return;
    }
    const map = new Map();
    for (const visit of visits) {
      const item = map.get(visit.customer) ?? { name: visit.customer, count: 0, members: new Set() };
      item.count++;
      item.members.add(visit.memberId);
      map.set(visit.customer, item);
    }
    const rows = [...map.values()]
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'))
      .map((row) => `<tr><td>${esc(row.name)}</td><td><b>${row.count}</b></td><td>${row.members.size}</td></tr>`)
      .join('');
    document.getElementById('visits').innerHTML = `
      <table>
        <thead><tr><th>客户</th><th>拜访次数</th><th>涉及成员</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }

  function itemFields(item) {
    const fields = [
      ['客户/项目包', item.isProjectPackage],
      ['拜访对象', item.visitTarget],
      ['职务层级', item.jobLevel],
      ['部门名称', item.department],
      ['涉及产品', item.products],
      ['跑动类型', item.runType],
      ['计划工作内容', item.plannedWork],
      ['实际完成说明', item.actualCompletion, true]
    ];
    return `<div class="dd-grid">${fields.map(([label, value, wide]) => `<div class="${wide ? 'wide' : ''}"><span>${label}</span><b>${show(value)}</b></div>`).join('')}</div>`;
  }

  function renderMemberOptions(data) {
    const select = document.getElementById('memberSelect');
    const previous = select.value || selectedMember;
    const plans = data.plans ?? [];
    select.innerHTML =
      '<option value="all">全部成员</option>' +
      plans.map((plan) => `<option value="${esc(plan.memberId)}">${esc(plan.name)}</option>`).join('');
    select.value = Array.from(select.options).some((option) => option.value === previous)
      ? previous
      : 'all';
    selectedMember = select.value;
  }

  function renderPlans(data) {
    const allPlans = data.plans ?? [];
    const plans = selectedMember === 'all'
      ? allPlans
      : allPlans.filter((plan) => plan.memberId === selectedMember);
    if (!plans.length) {
      document.getElementById('plans').innerHTML = '<div class="empty">本期没有成员每日计划</div>';
      return;
    }
    document.getElementById('plans').innerHTML = plans.map((plan, index) => {
      const color = COLORS[index % COLORS.length];
      const stats = plan.stats ?? statsOf([]);
      const rows = plan.days.map((day) => {
        const st = STATUS[day.status];
        const summary = (day.items ?? [])
          .map((item) => item.actualCompletion || item.plannedWork || '')
          .filter(Boolean)
          .join('；') || day.plan || '';
        const customers = day.customers?.length ? day.customers.join('、') : '—';
        const structure = (day.items ?? []).filter((item) =>
          item.runType || item.visitTarget || item.jobLevel || item.department || item.plannedWork || item.actualCompletion
        );
        const details = structure.length
          ? `<tr><td colspan="7" style="padding:0;border:0"><details class="day-detail"><summary>${mmdd(day.date)} · 客户明细 ${structure.length} 条</summary><div class="dd-body">${structure.map((item) => `<div style="margin-top:8px"><div class="dd-head" style="font-size:11.5px;font-weight:590;margin-bottom:8px">${esc(item.customer)}</div>${itemFields(item)}</div>`).join('')}</div></details></td></tr>`
          : '';
        return `<tr>
          <td>${mmdd(day.date)}</td>
          <td>${esc(day.weekday ?? weekday(day.date))}</td>
          <td><span class="status ${st.cls}">${st.icon} ${st.text}</span></td>
          <td>${day.at ?? '—'}</td>
          <td>${day.photos ?? 0}</td>
          <td class="cust">${esc(customers)}</td>
          <td class="plan-text">${summary ? esc(summary) : '—'}</td>
        </tr>${details}`;
      }).join('');
      return `<div class="plan-block">
        <div class="plan-head">
          <span class="ava" style="background:${color}14;color:${color}">${esc(initials(plan.name))}</span>
          <b>${esc(plan.name)}</b>
          <div class="chips">
            <span class="chip2">实交 <b>${stats.submitted}/${stats.expected}</b></span>
            <span class="chip2">按时 <b>${stats.onTime}</b></span>
            <span class="chip2">迟交 <b>${stats.late}</b></span>
            <span class="chip2">未交 <b>${stats.missing}</b></span>
            <span class="chip2">带照片 <b>${stats.withPhoto}</b></span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="plan-table">
            <thead><tr><th>日期</th><th>星期</th><th>状态</th><th>提交</th><th>照片</th><th>客户</th><th>计划 / 实际完成</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
    }).join('');
  }

  function render() {
    const data = DATASETS[current];
    const dashboard = data.dashboard;
    const stats = statsOf(dashboard.submissions);
    document.getElementById('sub').textContent = `${dashboard.team} · ${dashboard.label} · 截止 ${dashboard.deadline}`;
    document.getElementById('heroMeta').innerHTML = `
      <span class="chip">${dashboard.period === 'week' ? '周报' : '月报'}</span>
      <span class="chip">应提交 <b>${stats.expected}</b></span>
      <span class="chip">已提交 <b>${stats.submitted}</b></span>
      <span class="chip">覆盖 <b>${dashboard.members.length}</b> 人 × <b>${dashboard.workdays.length}</b> 天</span>`;
    renderKpis(dashboard);
    if (dashboard.period === 'month') renderMatrix(dashboard);
    document.getElementById('matrixSection').style.display = dashboard.period === 'month' ? '' : 'none';
    renderMembers(dashboard);
    renderVisits(dashboard);
    renderMemberOptions(data);
    renderPlans(data);
    document.querySelectorAll('#periodSeg button').forEach((button) => {
      button.classList.toggle('on', button.dataset.period === current);
    });
  }

  document.getElementById('periodSeg').addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.dataset.period === current) return;
    current = button.dataset.period;
    render();
  });

  document.getElementById('memberSelect').addEventListener('change', (event) => {
    selectedMember = event.target.value;
    renderPlans(DATASETS[current]);
  });

  render();
</script>
</body>
</html>
